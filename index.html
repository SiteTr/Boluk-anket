<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bölük Anket & Yoklama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; }
    .tab-active { border-bottom: 2px solid #0f172a; color: #0f172a; font-weight: 700; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- ÜST MENÜ -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-xs">
    <div class="max-w-4xl mx-auto px-3 h-16 flex items-center justify-between gap-1 overflow-x-auto">
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-sm">🛡️</div>
        <div>
          <span class="font-bold text-sm sm:text-base tracking-tight block leading-none">Bölük Anket</span>
          <span id="dbStatusBadge" class="text-[10px] text-emerald-600 font-bold">● Canlı Aktif</span>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <span id="totalPersonnelBadge" class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl border border-slate-200 shadow-2xs">184 Kişi</span>
        <button onclick="showView('pollsView')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xs transition">Anketler</button>
        <button onclick="openAdminGate(); switchAdminTab('tabCreate');" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xs flex items-center gap-1 transition"><span>+</span> Yeni Anket</button>
        <button onclick="openAdminGate()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-200 transition">Kıdemli Paneli</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-5">

    <!-- 1. ANKET LİSTESİ EKRANI -->
    <section id="pollsView" class="space-y-4">
      <!-- Aktif / Eski Sekmeleri -->
      <div class="flex gap-2 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-2xs w-fit">
        <button onclick="setPollFilter('active')" id="btnFilterActive" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white transition shadow-2xs">Aktif Anketler (1)</button>
        <button onclick="setPollFilter('old')" id="btnFilterOld" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition">Eski Anketler (0)</button>
      </div>

      <div id="pollsList" class="space-y-4"></div>
    </section>

    <!-- 2. OY VERME EKRANI -->
    <section id="voteView" class="hidden bg-white border border-slate-200 rounded-2xl p-5 sm:p-7 shadow-sm space-y-5">
      <button onclick="showView('pollsView')" class="text-xs font-bold text-blue-600 hover:underline">← Anketlere Geri Dön</button>
      <div>
        <h2 id="votePollTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900"></h2>
        <p id="votePollDesc" class="text-xs sm:text-sm text-slate-600 mt-1"></p>
      </div>

      <div class="space-y-4 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">1. Apolet No veya İsim ile Arayın</label>
          <input type="text" id="voterSearch" oninput="filterVoterSelect()" placeholder="Örn: 184 veya Abdullah..." class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
          <select id="voterSelect" size="5" class="w-full mt-2.5 bg-white border border-slate-300 rounded-xl p-2 text-sm focus:outline-none shadow-2xs"></select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-2">2. Durumunuzu Seçin</label>
          <div id="voteOptionsList" class="space-y-2.5"></div>
        </div>

        <button onclick="submitVote()" id="submitVoteBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-sm shadow-sm transition">Oyumu Kaydet ve Gönder</button>
      </div>
    </section>

    <!-- 3. KIDEMLİ (ADMİN) PANELİ -->
    <section id="adminView" class="hidden space-y-5">
      <div class="flex border-b border-slate-200 bg-white px-3 rounded-2xl border border-slate-200 gap-4 text-xs sm:text-sm overflow-x-auto shadow-2xs">
        <button onclick="switchAdminTab('tabControl')" id="btn_tabControl" class="py-3 tab-active whitespace-nowrap">Katılım Kontrolü</button>
        <button onclick="switchAdminTab('tabCreate')" id="btn_tabCreate" class="py-3 text-slate-500 font-semibold whitespace-nowrap">Yeni Anket Aç</button>
        <button onclick="switchAdminTab('tabRoster')" id="btn_tabRoster" class="py-3 text-slate-500 font-semibold whitespace-nowrap">Personel Listesi (184)</button>
        <button onclick="switchAdminTab('tabSettings')" id="btn_tabSettings" class="py-3 text-slate-500 font-semibold whitespace-nowrap">Şifre & Sistem</button>
      </div>

      <!-- Sekme 1: Kontrol -->
      <div id="tabControl" class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-2xs space-y-4">
          <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
            <select id="adminPollSelect" onchange="renderAdminControl()" class="w-full sm:flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 focus:outline-none"></select>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
              <button onclick="copyPollLink()" class="flex-1 sm:flex-none px-3.5 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700">🔗 Link</button>
              <button onclick="copyMissingWhatsApp()" class="flex-1 sm:flex-none px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-2xs">📋 Eksikleri Kopyala (WP)</button>
              <button onclick="exportCSV()" class="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold">📥 Excel</button>
              <button onclick="deleteCurrentPoll()" class="px-3.5 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold">Sil</button>
            </div>
          </div>

          <!-- Özet Sayılar -->
          <div id="adminSummaryStats" class="grid grid-cols-3 gap-3 text-center"></div>

          <!-- Dağılım -->
          <div id="adminOptionBreakdown" class="space-y-1.5 pt-2 border-t border-slate-100"></div>
        </div>

        <!-- Filtre ve Arama -->
        <div class="flex flex-col sm:flex-row gap-2 justify-between items-center bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
          <div class="flex gap-1 bg-slate-100 p-1 rounded-xl w-full sm:w-auto text-xs font-bold">
            <button onclick="setAdminFilter('all')" id="flt_all" class="flex-1 px-3.5 py-2 rounded-lg bg-white text-slate-900 shadow-2xs">Tümü</button>
            <button onclick="setAdminFilter('missing')" id="flt_missing" class="flex-1 px-3.5 py-2 rounded-lg text-red-600">İşaretlemeyen (Kırmızı)</button>
            <button onclick="setAdminFilter('voted')" id="flt_voted" class="flex-1 px-3.5 py-2 rounded-lg text-emerald-600">İşaretleyen (Yeşil)</button>
          </div>
          <input type="text" id="adminSearchInput" oninput="renderAdminControl()" placeholder="Apolet veya isim ara..." class="w-full sm:w-64 bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none">
        </div>

        <p class="text-xs text-slate-500 px-1">💡 Not: Kişinin kutusuna tıklayarak kıdemli olarak manuel oy işaretleyebilir veya mevcut oyunu silebilirsiniz.</p>

        <!-- Renkli Personel Grid -->
        <div id="adminPersonnelGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
      </div>

      <!-- Sekme 2: Yeni Anket -->
      <div id="tabCreate" class="hidden bg-white border border-slate-200 rounded-2xl p-6 space-y-4 shadow-2xs">
        <h3 class="font-bold text-base text-slate-900">Yeni Anket Oluştur</h3>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Anket Başlığı</label>
          <input type="text" id="newPollTitle" placeholder="Örn: Hafta Sonu Çarşı İzni Yoklaması" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Açıklama (İsteğe bağlı)</label>
          <input type="text" id="newPollDesc" placeholder="Örn: Saat 17:00'a kadar herkes işaretlesin." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Seçenekler (Her satıra bir seçenek)</label>
          <textarea id="newPollOptions" rows="4" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3.5 text-sm focus:outline-none">Çarşıya Çıkacağım
Birlikte Kalacağım
İzinli / Raporlu</textarea>
        </div>
        <button onclick="createNewPoll()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-6 py-3.5 rounded-xl text-sm shadow-sm transition">Anketi Yayınla</button>
      </div>

      <!-- Sekme 3: Liste -->
      <div id="tabRoster" class="hidden bg-white border border-slate-200 rounded-2xl p-6 space-y-4 shadow-2xs">
        <h3 class="font-bold text-base text-slate-900">Bölük Personel Listesi (184 Kişi)</h3>
        <textarea id="rosterTextarea" rows="12" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3.5 text-xs font-mono"></textarea>
        <button onclick="saveRoster()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-6 py-3.5 rounded-xl text-sm transition">Listeyi Güncelle</button>
      </div>

      <!-- Sekme 4: Ayarlar -->
      <div id="tabSettings" class="hidden bg-white border border-slate-200 rounded-2xl p-6 space-y-5 shadow-2xs">
        <div>
          <h3 class="font-bold text-base text-slate-900 mb-1">🔑 Kıdemli Panel Şifresi</h3>
          <div class="flex gap-2 max-w-sm mt-2">
            <input type="text" id="adminPassInput" placeholder="Yeni şifre" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none">
            <button onclick="saveAdminPass()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition">Güncelle</button>
          </div>
        </div>
        <hr class="border-slate-100">
        <div>
          <h3 class="font-bold text-base text-slate-900 mb-1">🔥 Firebase Bağlantısı</h3>
          <input type="text" id="firebaseInputUrl" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-mono text-slate-600" readonly>
        </div>
      </div>
    </section>

  </main>

  <!-- Bildirim Kutusu -->
  <div id="toast" class="fixed bottom-5 right-5 hidden bg-slate-900 text-white text-xs font-bold px-4.5 py-3 rounded-xl shadow-2xl z-50 transition-all"></div>

    async function initApp() {
      document.getElementById('firebaseInputUrl').value = dbUrl;
      await fetchFromDatabase();

      const urlParams = new URLSearchParams(window.location.search);
      const pollParam = urlParams.get('poll');
      if (pollParam && appData.polls.some(p => p.id === pollParam)) {
        openVoteView(pollParam);
      } else {
        renderPollsList();
      }

      setInterval(() => {
        fetchFromDatabase(true);
      }, 4000);
    }

    function cleanDbUrl(url) {
      let u = url.trim();
      if (u.endsWith('/')) u = u.slice(0, -1);
      return u;
    }

    async function fetchFromDatabase(silent = false) {
      try {
        const res = await fetch(`${cleanDbUrl(dbUrl)}/bolukData.json`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (data && data.personnel && data.personnel.length > 0) {
          appData.personnel = data.personnel;
          appData.polls = data.polls || [];
          appData.adminPass = data.adminPass || "1234";
          adminPass = appData.adminPass;
          localStorage.setItem('boluk_backup', JSON.stringify(appData));
        } else {
          loadLocalOrInit();
          await pushToDatabase();
        }
      } catch (err) {
        if (!silent) loadLocalOrInit();
      }

      document.getElementById('totalPersonnelBadge').textContent = `${appData.personnel.length} Kişi`;
      renderPollsList();
      if (!document.getElementById('adminView').classList.contains('hidden')) {
        renderAdminControl();
      }
    }

    function loadLocalOrInit() {
      const saved = localStorage.getItem('boluk_backup');
      if (saved) {
        appData = JSON.parse(saved);
        adminPass = appData.adminPass || "1234";
      } else {
        appData.personnel = defaultRealPersonnel;
        appData.polls = [{
          id: 'anket_1',
          title: 'Hafta Sonu Çarşı İzni Yoklaması',
          createdAt: new Date().toLocaleDateString('tr-TR'),
          options: ['Çarşıya Çıkacağım', 'Birlikte Kalacağım', 'İzinli / Raporlu'],
          votes: {},
          status: 'active'
        }];
        localStorage.setItem('boluk_backup', JSON.stringify(appData));
      }
    }

    async function pushToDatabase() {
      localStorage.setItem('boluk_backup', JSON.stringify(appData));
      try {
        await fetch(`${cleanDbUrl(dbUrl)}/bolukData.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(appData)
        });
      } catch (e) {}
    }

    async function pushSingleVote(pollIndex, apolet, choice) {
      localStorage.setItem('boluk_backup', JSON.stringify(appData));
      try {
        await fetch(`${cleanDbUrl(dbUrl)}/bolukData/polls/${pollIndex}/votes/${encodeURIComponent(apolet)}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(choice)
        });
      } catch (e) {
        await pushToDatabase();
      }
    }

    function showView(viewId) {
      ['pollsView', 'voteView', 'adminView'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
      if (viewId === 'pollsView') renderPollsList();
    }

    function setPollFilter(tab) {
      pollFilterTab = tab;
      const bAct = document.getElementById('btnFilterActive');
      const bOld = document.getElementById('btnFilterOld');
      if (tab === 'active') {
        bAct.className = "px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white transition shadow-2xs";
        bOld.className = "px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition";
      } else {
        bOld.className = "px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white transition shadow-2xs";
        bAct.className = "px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition";
      }
      renderPollsList();
    }

    function renderPollsList() {
      const container = document.getElementById('pollsList');
      const total = appData.personnel.length;

      const filteredPolls = (appData.polls || []).filter(p => {
        const isOld = p.status === 'old';
        return pollFilterTab === 'active' ? !isOld : isOld;
      });

      const activeCount = (appData.polls || []).filter(p => p.status !== 'old').length;
      const oldCount = (appData.polls || []).filter(p => p.status === 'old').length;
      document.getElementById('btnFilterActive').textContent = `Aktif Anketler (${activeCount})`;
      document.getElementById('btnFilterOld').textContent = `Eski Anketler (${oldCount})`;

      if (filteredPolls.length === 0) {
        container.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-8 text-center text-xs text-slate-500 shadow-2xs">Bu kategoride anket bulunmuyor.</div>`;
        return;
      }

      container.innerHTML = filteredPolls.map(poll => {
        const votesObj = poll.votes || {};
        const votedCount = appData.personnel.filter(p => votesObj[p.apolet]).length;
        const missingCount = total - votedCount;
        const pct = total > 0 ? Math.round((votedCount / total) * 100) : 0;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-2xs space-y-4">
            <div class="flex justify-between items-start gap-2">
              <div>
                <h2 class="font-bold text-base sm:text-lg text-slate-900">${poll.title}</h2>
                <span class="text-xs text-slate-400 font-medium">${poll.createdAt || ''}</span>
              </div>
              <button onclick="togglePollStatus('${poll.id}')" class="text-[11px] px-3 py-1.5 rounded-xl border font-bold transition ${poll.status === 'old' ? 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'}">
                ${poll.status === 'old' ? 'Arşivde (Aktif Yap)' : 'Arşive Taşı'}
              </button>
            </div>

            <!-- Sayılar (Katılan / Kalan / Toplam) -->
            <div class="grid grid-cols-3 gap-2 bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-center text-xs font-bold shadow-2xs">
              <div><span class="text-slate-500 font-normal">Katılan:</span> <span class="text-emerald-700">${votedCount}</span></div>
              <div><span class="text-slate-500 font-normal">Kalan:</span> <span class="text-red-600">${missingCount}</span></div>
              <div><span class="text-slate-500 font-normal">Toplam:</span> <span class="text-slate-900">${total}</span></div>
            </div>

            <!-- Yeşil İlerleme Çubuğu -->
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden border border-slate-200/50">
              <div class="bg-emerald-500 h-full transition-all duration-500" style="width: ${pct}%"></div>
            </div>

            <!-- Butonlar (WhatsApp İkonlu Link Kopyala & Oy Ver / Aç) -->
            <div class="flex gap-3 pt-1">
              <button onclick="sharePollWhatsApp('${poll.id}')" class="flex-1 border border-slate-200 hover:bg-slate-50 py-3 px-4 rounded-xl text-xs font-bold text-slate-700 flex items-center justify-center gap-1.5 transition shadow-2xs">
                <span class="text-emerald-600 text-sm">💬</span> Link Kopyala
              </button>
              <button onclick="openVoteView('${poll.id}')" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white py-3 px-4 rounded-xl text-xs font-bold shadow-sm transition">
                Oy Ver / Aç
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function togglePollStatus(pollId) {
      const poll = appData.polls.find(p => p.id === pollId);
      if (!poll) return;
      poll.status = poll.status === 'old' ? 'active' : 'old';
      await pushToDatabase();
      renderPollsList();
      showToast("Anket durumu güncellendi.");
    }

    function openVoteView(pollId) {
      activePollId = pollId;
      const poll = appData.polls.find(p => p.id === pollId);
      if (!poll) return;

      document.getElementById('votePollTitle').textContent = poll.title;
      document.getElementById('votePollDesc').textContent = poll.desc || 'Lütfen durumunuzu seçin.';
      document.getElementById('voterSearch').value = '';
      filterVoterSelect();

      const optsContainer = document.getElementById('voteOptionsList');
      optsContainer.innerHTML = (poll.options || []).map((opt, idx) => `
        <label class="flex items-center gap-3 p-3.5 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition shadow-2xs">
          <input type="radio" name="pollOption" value="${opt}" ${idx === 0 ? 'checked' : ''} class="w-4 h-4 text-slate-900">
          <span class="text-sm font-semibold text-slate-800">${opt}</span>
        </label>
      `).join('');

      showView('voteView');
    }

    function filterVoterSelect() {
      const q = document.getElementById('voterSearch').value.toLowerCase().trim();
      const select = document.getElementById('voterSelect');
      const poll = appData.polls.find(p => p.id === activePollId);
      const votes = (poll && poll.votes) ? poll.votes : {};

      const filtered = appData.personnel.filter(p =>
        p.apolet.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
      );

      select.innerHTML = filtered.map((p, i) => {
        const hasVoted = votes[p.apolet] ? ' (İşaretledi ✓)' : '';
        return `<option value="${p.apolet}" ${i === 0 ? 'selected' : ''}>${p.apolet} - ${p.name}${hasVoted}</option>`;
      }).join('');
    }

    async function submitVote() {
      const apolet = document.getElementById('voterSelect').value;
      const selectedOpt = document.querySelector('input[name="pollOption"]:checked');
      if (!apolet) return showToast("Lütfen isminizi veya apoletinizi seçin.");
      if (!selectedOpt) return showToast("Lütfen bir seçenek işaretleyin.");

      const pollIndex = appData.polls.findIndex(p => p.id === activePollId);
      if (pollIndex === -1) return;

      const btn = document.getElementById('submitVoteBtn');
      btn.textContent = "Kaydediliyor...";
      btn.disabled = true;

      if (!appData.polls[pollIndex].votes) appData.polls[pollIndex].votes = {};
      appData.polls[pollIndex].votes[apolet] = selectedOpt.value;

      await pushSingleVote(pollIndex, apolet, selectedOpt.value);

      btn.textContent = "Oyumu Kaydet ve Gönder";
      btn.disabled = false;
      showToast("Oyunuz başarıyla kaydedildi!");
      showView('pollsView');
    }

    function openAdminGate() {
      if (!adminUnlocked) {
        const p = prompt("Kıdemli Paneli Şifresi (Varsayılan: 1234):");
        if (p === null) return;
        if (p !== adminPass) return showToast("Hatalı şifre!");
        adminUnlocked = true;
      }
      populateAdminPollSelect();
      document.getElementById('rosterTextarea').value = appData.personnel.map(p => `${p.apolet}\t${p.name}`).join('\n');
      showView('adminView');
      renderAdminControl();
    }

    function switchAdminTab(tabId) {
      ['tabControl', 'tabCreate', 'tabRoster', 'tabSettings'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById('btn_' + id).className = "py-3 text-slate-500 font-semibold whitespace-nowrap";
      });
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn_' + tabId).className = "py-3 tab-active whitespace-nowrap";
    }

    function populateAdminPollSelect() {
      const sel = document.getElementById('adminPollSelect');
      if (!appData.polls || appData.polls.length === 0) {
        sel.innerHTML = `<option value="">Anket Yok</option>`;
        return;
      }
      const currentVal = sel.value;
      sel.innerHTML = appData.polls.map(p => `<option value="${p.id}">${p.title}</option>`).join('');
      if (currentVal && appData.polls.some(p => p.id === currentVal)) {
        sel.value = currentVal;
      } else if (activePollId && appData.polls.some(p => p.id === activePollId)) {
        sel.value = activePollId;
      }
    }

    function setAdminFilter(flt) {
      adminFilter = flt;
      ['all', 'missing', 'voted'].forEach(k => {
        document.getElementById('flt_' + k).className = "flex-1 px-3.5 py-2 rounded-lg text-slate-500";
      });
      document.getElementById('flt_' + flt).className = "flex-1 px-3.5 py-2 rounded-lg bg-white text-slate-900 font-bold shadow-2xs";
      renderAdminControl();
    }

    function renderAdminControl() {
      const sel = document.getElementById('adminPollSelect');
      const pollId = sel.value;
      const poll = appData.polls.find(p => p.id === pollId);
      if (!poll) return;

      const votes = poll.votes || {};
      const total = appData.personnel.length;
      const votedList = appData.personnel.filter(p => votes[p.apolet]);
      const missingList = appData.personnel.filter(p => !votes[p.apolet]);

      document.getElementById('adminSummaryStats').innerHTML = `
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
          <div class="text-[10px] font-bold text-slate-500 uppercase">Toplam</div>
          <div class="text-base font-extrabold text-slate-900">${total}</div>
        </div>
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-emerald-900">
          <div class="text-[10px] font-bold text-emerald-700 uppercase">İşaretleyen</div>
          <div class="text-base font-extrabold">${votedList.length}</div>
        </div>
        <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-red-900">
          <div class="text-[10px] font-bold text-red-700 uppercase">Eksik</div>
          <div class="text-base font-extrabold">${missingList.length}</div>
        </div>
      `;

      const counts = {};
      (poll.options || []).forEach(o => counts[o] = 0);
      Object.values(votes).forEach(v => { if (counts[v] !== undefined) counts[v]++; });

      document.getElementById('adminOptionBreakdown').innerHTML = (poll.options || []).map(opt => {
        const c = counts[opt] || 0;
        const pct = total > 0 ? Math.round((c / total) * 100) : 0;
        return `
          <div class="flex justify-between text-xs bg-slate-50 px-3.5 py-2 rounded-xl font-semibold border border-slate-100">
            <span class="text-slate-700">${opt}</span>
            <span class="text-slate-900">${c} Kişi (%${pct})</span>
          </div>
        `;
      }).join('');

      const q = document.getElementById('adminSearchInput').value.toLowerCase().trim();
      let list = appData.personnel.filter(p =>
        p.apolet.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
      );

      if (adminFilter === 'missing') list = list.filter(p => !votes[p.apolet]);
      if (adminFilter === 'voted') list = list.filter(p => votes[p.apolet]);

      const grid = document.getElementById('adminPersonnelGrid');
      grid.innerHTML = list.map(p => {
        const choice = votes[p.apolet];
        if (choice) {
          return `
            <div onclick="adminToggleVote('${poll.id}', '${p.apolet}')" class="cursor-pointer bg-emerald-50 border border-emerald-300 rounded-xl p-3 hover:bg-emerald-100 transition shadow-2xs flex flex-col justify-between">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-emerald-900">No: ${p.apolet}</span>
                <span class="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-bold">✓</span>
              </div>
              <div class="text-xs font-bold text-emerald-950 truncate">${p.name}</div>
              <div class="text-[10px] text-emerald-700 truncate mt-1 font-semibold">${choice}</div>
            </div>
          `;
        } else {
          return `
            <div onclick="adminToggleVote('${poll.id}', '${p.apolet}')" class="cursor-pointer bg-red-50 border border-red-300 rounded-xl p-3 hover:bg-red-100 transition shadow-2xs flex flex-col justify-between">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-red-900">No: ${p.apolet}</span>
                <span class="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">EKSİK</span>
              </div>
              <div class="text-xs font-bold text-red-950 truncate">${p.name}</div>
              <div class="text-[10px] text-red-600 mt-1">İşaretlemedi</div>
            </div>
          `;
        }
      }).join('');
    }

    async function adminToggleVote(pollId, apolet) {
      const pollIndex = appData.polls.findIndex(p => p.id === pollId);
      if (pollIndex === -1) return;
      const poll = appData.polls[pollIndex];
      if (!poll.votes) poll.votes = {};

      const person = appData.personnel.find(p => p.apolet === apolet);
      const current = poll.votes[apolet];

      if (current) {
        if (confirm(`${person.apolet} - ${person.name} personelinin "${current}" oyunu silmek istiyor musunuz?`)) {
          delete poll.votes[apolet];
          await pushToDatabase();
          renderAdminControl();
        }
      } else {
        const optsText = poll.options.map((o, i) => `${i + 1} - ${o}`).join('\n');
        const inp = prompt(`${person.apolet} - ${person.name} adına hangi seçeneği işaretlemek istiyorsunuz? (Sayı girin):\n\n${optsText}`, "1");
        if (inp === null) return;
        const idx = parseInt(inp) - 1;
        if (!isNaN(idx) && poll.options[idx]) {
          poll.votes[apolet] = poll.options[idx];
          await pushSingleVote(pollIndex, apolet, poll.options[idx]);
          renderAdminControl();
          showToast("Manuel oy kaydedildi.");
        }
      }
    }

    async function createNewPoll() {
      const title = document.getElementById('newPollTitle').value.trim();
      const desc = document.getElementById('newPollDesc').value.trim();
      const opts = document.getElementById('newPollOptions').value.split('\n').map(s => s.trim()).filter(Boolean);

      if (!title || opts.length < 1) return showToast("Başlık ve en az 1 seçenek girin.");

      const newPoll = {
        id: 'anket_' + Date.now(),
        title,
        desc,
        createdAt: new Date().toLocaleDateString('tr-TR'),
        options: opts,
        votes: {},
        status: 'active'
      };

      appData.polls.unshift(newPoll);
      await pushToDatabase();

      document.getElementById('newPollTitle').value = '';
      document.getElementById('newPollDesc').value = '';
      populateAdminPollSelect();
      document.getElementById('adminPollSelect').value = newPoll.id;
      switchAdminTab('tabControl');
      renderAdminControl();
      showToast("Yeni anket yayınlandı!");
    }

    async function deleteCurrentPoll() {
      const pollId = document.getElementById('adminPollSelect').value;
      if (!pollId) return;
      if (!confirm("Bu anketi silmek istediğinize emin misiniz?")) return;
      appData.polls = appData.polls.filter(p => p.id !== pollId);
      await pushToDatabase();
      populateAdminPollSelect();
      renderAdminControl();
      showToast("Anket silindi.");
    }

    async function saveRoster() {
      const lines = document.getElementById('rosterTextarea').value.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = lines.map((line, idx) => {
        const parts = line.split(/\s+/);
        const apolet = parts[0] || String(idx + 1);
        const name = parts.slice(1).join(' ') || `Personel ${idx + 1}`;
        return { apolet, name };
      });

      if (parsed.length === 0) return showToast("Liste boş olamaz!");
      appData.personnel = parsed;
      await pushToDatabase();
      document.getElementById('totalPersonnelBadge').textContent = `${appData.personnel.length} Kişi`;
      renderAdminControl();
      showToast(`${parsed.length} personel güncellendi!`);
    }

    async function saveAdminPass() {
      const p = document.getElementById('adminPassInput').value.trim();
      if (!p) return showToast("Şifre boş olamaz.");
      adminPass = p;
      appData.adminPass = p;
      await pushToDatabase();
      document.getElementById('adminPassInput').value = '';
      showToast("Şifre güncellendi!");
    }

    function getShareUrl(pollId) {
      const base = window.location.origin + window.location.pathname;
      return `${base}?poll=${encodeURIComponent(pollId)}`;
    }

    function sharePollWhatsApp(pollId) {
      const poll = appData.polls.find(p => p.id === pollId);
      if (!poll) return;
      const link = getShareUrl(pollId);
      const text = `📢 *${poll.title.toUpperCase()}*\nLütfen oylamaya katılın:\n🔗 ${link}`;
      navigator.clipboard.writeText(text);
      showToast("WhatsApp anket linki kopyalandı!");
    }

    function copyPollLink() {
      const pollId = document.getElementById('adminPollSelect').value;
      if (pollId) sharePollWhatsApp(pollId);
    }

    function copyMissingWhatsApp() {
      const pollId = document.getElementById('adminPollSelect').value;
      const poll = appData.polls.find(p => p.id === pollId);
      if (!poll) return;
      const votes = poll.votes || {};
      const missing = appData.personnel.filter(p => !votes[p.apolet]);

      const link = getShareUrl(pollId);
      const text = `📢 *${poll.title.toUpperCase()} - EKSİK LİSTESİ*\n` +
        `Henüz işaretlemeyen *${missing.length}* personel:\n\n` +
        missing.map(m => `• ${m.apolet} - ${m.name}`).join('\n') +
        `\n\n🔗 *Hemen Katıl:* ${link}`;

      navigator.clipboard.writeText(text);
      showToast(`Eksik olan ${missing.length} kişinin WhatsApp listesi kopyalandı!`);
    }

    function exportCSV() {
      const pollId = document.getElementById('adminPollSelect').value;
      const poll = appData.polls.find(p => p.id === pollId);
      if (!poll) return;
      const votes = poll.votes || {};

      let csv = "\uFEFFApolet No;İsim Soyisim;Durum;Seçim\n";
      appData.personnel.forEach(p => {
        const c = votes[p.apolet];
        csv += `${p.apolet};${p.name};${c ? 'İşaretledi' : 'EKSİK'};${c || '-'}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${poll.title}_Kontrol.csv`;
      a.click();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3200);
    }
